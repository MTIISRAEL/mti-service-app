<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>MTI שירות</title>
<meta name="theme-color" content="#1d4f8c">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f5f8;--card:#fff;--ink:#16202c;--muted:#5d6b7b;--line:#dde3ea;
  --brand:#1d4f8c;--brand-ink:#fff;--brand-soft:#e6eef8;
  --ok:#17803d;--ok-soft:#e3f4e8;--warn:#a85a00;--warn-soft:#fdf0dc;--bad:#c02626;--bad-soft:#fde6e6;
  --radius:12px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Rubik,Arial,sans-serif;font-size:16px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand)}
#app{max-width:760px;margin:0 auto;min-height:100vh;padding-bottom:84px}
header{position:sticky;top:0;z-index:5;background:var(--brand);color:var(--brand-ink);padding:12px 16px;display:flex;align-items:center;gap:10px}
header h1{font-size:18px;margin:0;flex:1;font-weight:700}
header .who{font-size:14px;opacity:.9}
header button{background:transparent;border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:8px;padding:4px 10px;font-size:14px}
main{padding:12px 16px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;z-index:5;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .inner{display:flex;max-width:760px;width:100%}
nav.tabs button{flex:1;border:0;background:none;padding:10px 4px 12px;font-size:14px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button .ico{font-size:20px;line-height:1}
nav.tabs button.on{color:var(--brand);font-weight:700}
@media (max-width:480px){nav.tabs button{font-size:12px;padding:8px 2px 10px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin:0 0 10px}
.card.tap{cursor:pointer}
.card.tap:active{background:#fafbfd}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.grow{flex:1}
.muted{color:var(--muted)}
.small{font-size:14px}
.big{font-size:20px;font-weight:700}
h2{font-size:20px;margin:6px 0 12px}
h3{font-size:16px;margin:16px 0 8px}
.chip{display:inline-block;border-radius:999px;padding:2px 10px;font-size:13px;background:var(--brand-soft);color:var(--brand);white-space:nowrap}
.chip.urgent{background:var(--bad-soft);color:var(--bad);font-weight:700}
.chip.stuck{background:var(--warn-soft);color:var(--warn);font-weight:700}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.grey{background:#eef0f3;color:var(--muted)}
.chip.new{background:var(--brand);color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 14px;min-height:44px;cursor:pointer}
.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand);font-weight:500}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn.bad{color:var(--bad);border-color:#f0c4c4}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.btn.sm{min-height:36px;padding:6px 10px;font-size:14px}
label.f{display:block;margin:10px 0 4px;font-size:14px;color:var(--muted);font-weight:500}
input[type=text],input[type=tel],input[type=number],input[type=date],input[type=time],input[type=password],select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;min-height:44px}
textarea{min-height:84px;resize:vertical}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:84px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 8px;min-height:44px}
.seg.wide button{min-width:140px}
.seg button.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:500}
.banner{border-radius:var(--radius);padding:12px 14px;margin:0 0 12px;font-weight:500}
.banner.bad{background:var(--bad-soft);color:var(--bad)}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.banner.info{background:var(--brand-soft);color:var(--brand)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:15px}
.kv .k{color:var(--muted)}
.sheet{position:fixed;inset:0;background:var(--bg);z-index:20;overflow:auto}
.sheet .inner{max-width:760px;margin:0 auto;padding:0 0 40px}
.sheet .bar{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:10px 12px;z-index:2}
.sheet .bar .t{flex:1;font-weight:700}
.sheet .body{padding:12px 16px}
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:#16202c;color:#fff;padding:10px 16px;border-radius:10px;z-index:50;max-width:90%;text-align:center}
.toast.err{background:var(--bad)}
.suggest{border:2px solid var(--brand);background:var(--brand-soft)}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.thumbs img{width:84px;height:84px;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:#eee}
.thumbs .ph{width:84px;height:84px;border-radius:8px;border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--muted);cursor:pointer;text-align:center}
canvas.sig{width:100%;height:180px;background:#fff;border:1px dashed var(--muted);border-radius:10px;touch-action:none}
.day{margin:0 0 14px}
.day .dh{font-weight:700;margin:0 0 6px;display:flex;gap:8px;align-items:center}
.day.today .dh{color:var(--brand)}
.load{height:6px;background:#e6eaef;border-radius:3px;overflow:hidden;width:80px;display:inline-block;vertical-align:middle}
.load i{display:block;height:100%;background:var(--ok)}
.load i.full{background:var(--warn)}
.load i.over{background:var(--bad)}
.slot{border-inline-start:4px solid var(--brand);padding:6px 10px;background:#fff;border-radius:8px;margin:4px 0;font-size:14px;cursor:pointer}
.slot.urgent{border-color:var(--bad)}
.slot.old{border-color:#b9c2cc;color:var(--muted);cursor:default}
.slot.done{opacity:.6}
.empty{text-align:center;color:var(--muted);padding:28px 0}
.login{max-width:380px;margin:12vh auto 0;padding:0 20px}
.login .logo{font-size:28px;font-weight:700;color:var(--brand);text-align:center;margin-bottom:4px}
.login .gbtn{display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;color:#1f1f1f;border:1px solid #c7c7c7;text-decoration:none;font-weight:600;min-height:48px}
.login .gbtn .g{font-size:20px;color:#4285f4}
.login .or{display:flex;align-items:center;gap:10px;margin:22px 0 6px;color:var(--muted);font-size:14px}.login .or:before,.login .or:after{content:'';flex:1;border-top:1px solid #ddd}
.spin{display:inline-block;width:18px;height:18px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:s .7s linear infinite;vertical-align:middle}
@keyframes s{to{transform:rotate(360deg)}}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px}
.filters button{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:14px}
.filters button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t td,table.t th{border-bottom:1px solid var(--line);padding:8px 6px;text-align:right}
.code{font-family:monospace;font-size:18px;letter-spacing:2px}
hr.s{border:0;border-top:1px solid var(--line);margin:12px 0}
#app.wide{max-width:none}
#app.wide main{padding:8px 12px}
.cal-bar{display:flex;align-items:center;gap:6px;margin:0 0 8px;flex-wrap:wrap}
.cal-bar .ic{min-width:40px;font-size:22px;line-height:1;padding:4px 10px}
.cal-title{flex:1;font-size:20px;font-weight:500;padding:0 6px}
select.cal-sel{width:auto;min-height:36px;padding:6px 10px;border-radius:999px}
.cal-legend{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 8px}
.cal-legend .lg{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 10px;font-size:13px;cursor:pointer}
.cal-legend .lg i{width:12px;height:12px;border-radius:3px;display:inline-block}
.cal-legend .lg.off{opacity:.45;text-decoration:line-through}
.cal{background:#fff;border:1px solid var(--line);border-radius:14px}
.cal-sticky{position:sticky;z-index:4;background:#fff;border-radius:14px 14px 0 0;border-bottom:1px solid var(--line)}
.cal-head,.cal-ad,.cal-body{display:flex}
.cal-gut{width:54px;flex:none;position:relative;font-size:11px;text-align:center;padding-top:6px}
.cal-head .cal-gut{align-self:flex-end;padding-bottom:6px}
.cal-dh{flex:1;min-width:0;text-align:center;padding:8px 2px 6px;cursor:pointer}
.cal-dh .dn{font-size:12px;color:var(--muted)}
.cal-dh .dd{font-size:24px;line-height:40px;width:40px;height:40px;border-radius:50%;margin:2px auto 0}
.cal-dh.today .dn{color:#1a73e8;font-weight:500}
.cal-dh.today .dd{background:#1a73e8;color:#fff}
.cal-dh.pastday .dd{color:var(--muted)}
.cal-dh .ld{font-size:11px;color:var(--muted);margin-top:2px;display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.cal-dh .ld .full{color:var(--warn);font-weight:700}
.cal-adg{flex:1;display:grid;grid-template-columns:repeat(var(--n),1fr);grid-auto-flow:row dense;gap:2px;padding:2px 0 4px;min-height:8px}
.ad-ev{background:var(--c);color:#fff;border-radius:5px;font-size:12px;padding:2px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;margin:0 2px}
.ad-ev.past{background:color-mix(in srgb,var(--c) 30%,#fff);color:color-mix(in srgb,var(--c) 75%,#000)}
.cal-body .cal-gut .hl{position:absolute;right:0;left:6px;transform:translateY(-50%);font-size:11px;color:var(--muted);text-align:left}
.cal-cols{flex:1;display:flex;position:relative}
.cal-col{flex:1;min-width:0;position:relative;border-inline-start:1px solid var(--line);background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 48px}
.ev{position:absolute;box-sizing:border-box;background:var(--c);color:#fff;border-radius:6px;border:1px solid #fff;padding:2px 6px;font-size:12px;line-height:1.3;overflow:hidden;cursor:pointer;z-index:1}
.ev:hover{z-index:3;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.ev .t1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev .t2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.92}
.ev.past{background:color-mix(in srgb,var(--c) 30%,#fff);color:color-mix(in srgb,var(--c) 75%,#000)}
.ev.tent,.ad-ev.tent{background:#fff;color:var(--c);border:2px dashed var(--c)}
.now{position:absolute;left:0;right:0;height:2px;background:#ea4335;z-index:2}
.now:before{content:'';position:absolute;right:-6px;top:-5px;width:12px;height:12px;border-radius:50%;background:#ea4335}
.ag-day{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin:0 0 8px}
.ag-dh{font-weight:500;margin:0 0 4px}
.ag-dh .dd{font-size:20px;font-weight:700}
.ag-day.today .ag-dh{color:#1a73e8}
.ag-ev{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--line);font-size:14px;cursor:pointer}
.ag-ev i{width:10px;height:10px;border-radius:50%;flex:none}
.ag-ev .ag-t{width:96px;flex:none;color:var(--muted);font-size:13px}
.ag-ev.past{opacity:.6}
.dp{border:1px solid var(--line);border-radius:12px;margin:10px 0 4px;background:#fff;overflow:hidden}
.dp-bar{display:flex;align-items:center;gap:8px;padding:6px 8px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.dp-bar button{border:1px solid var(--line);background:#fff;border-radius:8px;min-width:36px;min-height:34px;font-size:20px;line-height:1;cursor:pointer}
.dp-ad{font-size:12px;padding:4px 10px;background:#fafbfc;border-bottom:1px solid var(--line);color:var(--muted)}
.dp-scroll{max-height:460px;overflow:auto;position:relative}
.dp-head{display:flex;position:sticky;top:0;background:#fff;z-index:8;border-bottom:1px solid var(--line)}
.dp-gut{width:44px;flex:none;position:relative}
.dp-ch{flex:1;min-width:0;text-align:center;padding:6px 2px 4px;font-size:13px;font-weight:500;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dp-ch i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-inline-end:4px;vertical-align:middle}
.dp-ch .ld{font-size:11px;color:var(--muted);font-weight:400}
.dp-ch .ld.full{color:var(--warn);font-weight:700}
.dp-ch.sel{border-bottom-color:var(--c);background:color-mix(in srgb,var(--c) 12%,#fff)}
.dp-body{display:flex}
.dp-body .dp-gut .hl{position:absolute;left:4px;right:0;transform:translateY(-50%);font-size:10.5px;color:var(--muted);text-align:left}
.dp-cols{flex:1;display:flex;position:relative}
.dp-col{flex:1;min-width:0;position:relative;border-inline-start:1px solid var(--line);background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 40px;cursor:copy}
.dp-col.sel{background-color:color-mix(in srgb,var(--c) 7%,#fff)}
.dp-col.oldc{cursor:default;background-color:#fafafa}
.dp .ev{font-size:11px;padding:1px 4px}
.dp .now:before{display:none}
.cal-search{margin:0 0 8px;position:relative}
.cal-search input{border-radius:999px;padding-inline-start:16px}
.cs-res{background:#fff;border:1px solid var(--line);border-radius:12px;margin-top:6px;padding:4px 12px 8px;max-height:60vh;overflow:auto;box-shadow:0 4px 14px rgba(0,0,0,.08)}
.cs-h{font-weight:700;font-size:13px;color:var(--muted);margin:10px 0 2px}
.cs-it{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);cursor:pointer;font-size:14px}
.cs-it:first-of-type{border-top:0}
.cs-it .cs-d{width:82px;flex:none;font-size:13px;color:var(--muted)}
.cs-it .cs-d b{display:block;color:var(--ink);font-size:14px}
.cs-it .cs-go{flex:none;font-size:12px;border:1px solid var(--line);border-radius:999px;padding:3px 8px;background:#fff;color:var(--brand)}
.mo{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.mo-hd{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--line);font-size:12px;color:var(--muted);text-align:center}
.mo-hd div{padding:6px 2px}
.mo-grid{display:grid;grid-template-columns:repeat(7,1fr)}
.mo-c{min-height:112px;border-inline-start:1px solid var(--line);border-bottom:1px solid var(--line);padding:3px 3px 4px;cursor:pointer;min-width:0}
.mo-c:nth-child(7n+1){border-inline-start:0}
.mo-c.out{background:#fafbfc}
.mo-c.out .mo-n{color:#b9c2cc}
.mo-n{font-size:12px;text-align:center;margin:0 0 2px}
.mo-c.today .mo-n{background:#1a73e8;color:#fff;border-radius:50%;width:22px;height:22px;line-height:22px;margin:0 auto 2px}
.mo-ev{font-size:11.5px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:4px;padding:1px 4px;margin:1px 0;background:color-mix(in srgb,var(--c) 16%,#fff);color:color-mix(in srgb,var(--c) 75%,#000)}
.mo-ev i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--c);margin-inline-end:3px;vertical-align:middle}
.mo-ev .t{opacity:.8}
.mo-ev.past{opacity:.55}
.mo-ev.tent{border:1px dashed var(--c)}
.mo-ev.task{border-inline-start:3px solid var(--c)}
.mo-more{font-size:11px;color:var(--muted);padding:0 4px}
@media (max-width:700px){.mo-c{min-height:84px}.mo-ev .t{display:none}.mo-ev{font-size:10.5px;padding:1px 2px}}
.st-tbl td,.st-tbl th{text-align:center}
.st-tbl td:first-child,.st-tbl th:first-child{text-align:right}
.st-tbl .z{color:#c3cad3}
.st-tbl small{display:block;color:var(--muted);font-size:11px}
.chip.task{background:#fff3c4;color:#7a5a00;font-weight:500}
.card.task{border-inline-start:4px solid #e0b400}
.ev.task,.ad-ev.task{background:color-mix(in srgb,var(--c) 14%,#fff);color:color-mix(in srgb,var(--c) 70%,#000);border:1px solid var(--c);border-inline-start:5px solid var(--c)}
.ev.task.past,.ad-ev.task.past{opacity:.6}
.ev.unas,.ad-ev.unas,.mo-ev.unas{background:repeating-linear-gradient(135deg,#f1f3f6 0 6px,#e4e8ed 6px 12px);color:#3a4654;border:1px solid #b9c2cc}
.ev .rz{position:absolute;left:0;right:0;bottom:0;height:7px;cursor:ns-resize}
.ev.dragging{opacity:.85;box-shadow:0 4px 14px rgba(0,0,0,.3);z-index:20 !important;cursor:grabbing}
.cal.can-drag .ev.ev-call,.cal.can-drag .ad-ev.ev-call{cursor:grab}
.ev.draft{background:#fff;color:var(--c);border:2px dashed var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 25%,transparent)}
@media (max-width:700px){.dp-gut{width:34px}.dp-ch{font-size:11px}.cal-head .cal-gut{font-size:0}.cal-gut{width:40px}.cal-dh .dd{font-size:18px;width:32px;height:32px;line-height:32px}.ev{font-size:11px;padding:1px 4px}.cal-dh .ld{display:none}.cal-title{font-size:17px}}
</style>
</head>
<body>
<div id="app"><div class="empty" style="margin-top:30vh"><span class="spin"></span></div></div>
<script src="firebase-config.js"></script>
<script src="core.js"></script>
<script src="db.js"></script>
<script>
/* ========= core ========= */
var S = { token: null, me: null, init: null, tab: null, cache: {} };
var store = {
  get: function (k) { try { return localStorage.getItem('mtis_' + k); } catch (e) { return null; } },
  set: function (k, v) { try { localStorage.setItem('mtis_' + k, v); } catch (e) {} },
  del: function (k) { try { localStorage.removeItem('mtis_' + k); } catch (e) {} }
};
/* כל פעולה רצה מיד בטלפון על העותק המקומי של הנתונים, והשמירה נשלחת לשרת ברקע */
function meUser() { return find_('users', S.me.id) || S.me; }
function api(action, payload) {
  if (action === 'init') { try { return Promise.resolve(ACTIONS.init(meUser())); } catch (e) { return Promise.reject(e); } }
  return runAction_(meUser(), action, payload).catch(function (e) { throw (e instanceof Error ? e : new Error(String(e))); });
}
function cachedApi(action, payload, cb) {
  return api(action, payload).then(function (d) { cb(d, false); return d; });
}
function cacheClear() {}
/* שינוי שהגיע ממשתמש אחר: מרעננים את המסך אם לא באמצע פעולה */
var _rt = null;
function onRemoteChange() {
  clearTimeout(_rt);
  _rt = setTimeout(function () {
    if (!S.me || !S.tab) return;
    var ae = document.activeElement;
    if ($('.sheet') || (ae && /INPUT|TEXTAREA|SELECT/.test(ae.tagName))) { _rt = setTimeout(onRemoteChange, 4000); return; }
    var y = window.scrollY; refresh(); setTimeout(function () { window.scrollTo(0, y); }, 60);
  }, 700);
}
function h(t) { return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function $(sel, root) { return (root || document).querySelector(sel); }
function $$(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
function toast(msg, err) {
  var t = document.createElement('div'); t.className = 'toast' + (err ? ' err' : ''); t.textContent = msg;
  document.body.appendChild(t); setTimeout(function () { t.remove(); }, err ? 4500 : 2500);
}
function fail(e) { toast(e && e.message ? e.message : String(e), true); }
function busy(btn, on) {
  if (!btn) return;
  if (on) { btn.dataset.t = btn.innerHTML; btn.disabled = true; btn.innerHTML = '<span class="spin"></span>'; }
  else { btn.disabled = false; if (btn.dataset.t) btn.innerHTML = btn.dataset.t; }
}
var DAY = ['ראשון', 'שני', 'שלישי', 'רביעי', 'חמישי', 'שישי', 'שבת'];
function pd(s) { var p = String(s).slice(0, 10).split('-'); return new Date(Date.UTC(+p[0], +p[1] - 1, +p[2])); }

/* ========= report form ========= */
function shrink(file, max) {
  return new Promise(function (res, rej) {
    var rd = new FileReader();
    rd.onload = function () {
      var img = new Image();
      img.onload = function () {
        var sc = Math.min(1, max / Math.max(img.width, img.height));
        var cv = document.createElement('canvas'); cv.width = Math.round(img.width * sc); cv.height = Math.round(img.height * sc);
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        res(cv.toDataURL('image/jpeg', 0.72));
      };
      img.onerror = rej; img.src = rd.result;
    };
    rd.onerror = rej; rd.readAsDataURL(file);
  });
}
function openReport(c, selfCoord, done) {

  if (!selfCoord) html += '<label class="f" id="r-ndl">מה לא בוצע / מה נשאר לעשות (אם יש)</label><textarea id="r-nd" style="min-height:60px" placeholder="למשל: חסר חיישן, צריך לחזור להחליף משאבה"></textarea>';
  if (!selfCoord) html += '<label class="f">חלקים שהשתמשת בהם</label><input id="r-parts" type="text" placeholder="למשל: משאבה 2HP, חיישן טמפרטורה">';
  html += '<label class="f">תמונות</label><div class="thumbs" id="r-thumbs"></div><label class="btn block" style="margin-top:6px">📷 צילום / הוספת תמונות<input id="r-file" type="file" accept="image/*" multiple style="display:none"></label>';
  if (!selfCoord) html += '<label class="f">חתימת לקוח</label><canvas class="sig" id="r-sig"></canvas><div class="row" style="margin-top:6px"><button class="btn sm" id="r-sigclr">ניקוי חתימה</button></div>';

  html += '<div style="height:16px"></div><button class="btn ok block" id="r-send">שליחת דיווח</button>';
  sh.body.innerHTML = html;
  var bindSeg = function (id, cb) { $$('#' + id + ' button', sh.body).forEach(function (b) { b.onclick = function () { $$('#' + id + ' button', sh.body).forEach(function (x) { x.classList.remove('on'); }); b.classList.add('on'); cb(b.dataset.v); }; }); };
  bindSeg('r-out', function (v) { st.outcome = v; $('#r-ndl').textContent = v === 'הושלם' ? 'מה לא בוצע / מה נשאר לעשות (אם יש)' : 'מה לא בוצע / מה נשאר לעשות (חובה)'; });
  bindSeg('r-pay', function (v) { st.pay = v; $('#r-amtbox').style.display = v === 'ללא תשלום' ? 'none' : ''; });
  if ($('#r-pay', sh.body)) $('#r-pay button', sh.body).classList.add('on');

    $$('#r-thumbs img').forEach(function (im) { im.onclick = function () { if (confirm('להסיר את התמונה?')) { st.photos.splice(+im.dataset.i, 1); drawThumbs(); } }; });
  };

  $('#r-send').onclick = function () {

    var p = { callId: c.id, outcome: st.outcome, work: $('#r-work').value, notDone: $('#r-nd') ? $('#r-nd').value : '', parts: $('#r-parts') ? $('#r-parts').value : '', photos: st.photos };
    if (cv && st.signed) p.signature = cv.toDataURL('image/png');
    if (internal && !selfCoord) { p.payMethod = st.pay; p.amount = $('#r-amt').value; }
    if (!selfCoord && !p.signature && !confirm('אין חתימת לקוח. לשלוח בכל זאת?')) return;

      '<label class="f">סיכום מלא (מאיר)</label><input id="a-sum" type="text" value="' + h(info.summaryEmails) + '">' +
      '<label class="f">שינויי שיבוץ ודחיפויות (קובי)</label><input id="a-kobi" type="text" value="' + h(info.kobiEmails) + '" placeholder="מייל של קובי">' +
      '<div style="height:10px"></div><button class="btn block" id="a-save">שמירה</button></div>' +
      '<h2>היסטוריה מהיומן הישן</h2><div class="card"><div class="small muted">' + info.oldCount + ' אירועים מיובאים.</div>' +
      '<label class="f">חיפוש בהיסטוריה</label><input id="a-q" type="text" placeholder="שם לקוח, יישוב…"><div id="a-res"></div></div>' +
      (info.sheetUrl ? '<h2>הגיליון</h2><div class="card small">טבלת ההתאמה, המחירון, האזורים וההגדרות נערכים בגיליון (מתעדכן כאן תוך כמה דקות). שאר הלשוניות הן גיבוי: <a href="' + h(info.sheetUrl) + '" target="_blank">פתיחת הגיליון</a></div>' : '');
    m.innerHTML = html;
    $$('[data-savephone]', m).forEach(function (b) {
      b.onclick = function () {
        busy(b, true);
        api('adminSetPhone', { id: b.dataset.savephone, phone: $('[data-phone="' + b.dataset.savephone + '"]', m).value.trim() }).then(function () { busy(b, false); toast('נשמר'); }).catch(function (e) { busy(b, false); fail(e); });
      };
    });
    $$('[data-share]', m).forEach(function (b) {
      b.onclick = function () {
        var email = $('[data-mail="' + b.dataset.share + '"]', m).value.trim();
        busy(b, true);
        api('adminSetEmail', { id: b.dataset.share, email: email }).then(function (r) { toast(r.shared ? 'נשמר. היומן האישי ישותף למייל תוך כמה דקות' : 'נשמר'); go('admin'); }).catch(function (e) { busy(b, false); fail(e); });
      };
    });
    $$('[data-act]', m).forEach(function (b) {
      b.onclick = function () { busy(b, true); api('adminSetActive', { id: b.dataset.act, active: b.dataset.on === '1' }).then(function () { go('admin'); }).catch(function (e) { busy(b, false); fail(e); }); };
    });
    $('#a-save').onclick = function () { var b = this; busy(b, true); api('adminSaveEmails', { summaryEmails: $('#a-sum').value, kobiEmails: $('#a-kobi').value }).then(function () { busy(b, false); toast('נשמר'); }).catch(function (e) { busy(b, false); fail(e); }); };
    var qt;
    $('#a-q').oninput = function () {
      var q = this.value; clearTimeout(qt);
      qt = setTimeout(function () {
        api('searchOld', { q: q }).then(function (list) {
          $('#a-res').innerHTML = list.map(function (e) { return '<div class="small" style="margin-top:8px;border-top:1px solid var(--line);padding-top:6px"><b>' + h(e.start) + '</b> · ' + h(e.title) + (e.location ? ' · ' + h(e.location) : '') + (e.description ? '<div class="muted">' + h(e.description).slice(0, 300) + '</div>' : '') + '</div>'; }).join('');
        }).catch(function () {});
      }, 400);
    };
  }).catch(fail);
}

/* ========= boot ========= */
function boot(user) {
  var email = String(user.email || '').toLowerCase();
  FB.getDoc(FB.doc(FB.db, 'access/' + email)).then(function (s) {
    var a = s.exists() ? s.data() : null;
    if (!a || a.active === 'לא') { FB.signOut(FB.auth); renderLogin('החשבון ' + email + ' לא רשום במערכת. פנה למאיר.'); return; }
    S.me = { id: a.uid, role: a.role, kind: a.kind || '', name: '' };
    return listen_(S.me).then(function () {
      var u = find_('users', a.uid);
      if (!u) { renderLogin('המשתמש לא נמצא במערכת'); return; }
      S.me = publicUser_(u);
      S.init = ACTIONS.init(u);
      store.set('mail', email);
      shell();
      var today = today_();
      if (String(u.lastSeen || '').slice(0, 10) !== today) { update_('users', u._row, { lastSeen: now_() }); flushWrites_().catch(function () {}); }
    });
  }).catch(function (e) {
    console.error(e);
    $('#app').innerHTML = '<div class="banner bad" style="margin:20px">לא הצלחנו לטעון את הנתונים. ' + h(e && e.code === 'permission-denied' ? 'אין הרשאה.' : (e && e.message || '')) + ' <button class="btn sm" onclick="location.reload()">נסה שוב</button></div>';
  });
}
function start() {
  var url = location.href;
  if (FB.isSignInWithEmailLink(FB.auth, url)) {
    var mail = store.get('mail') || prompt('לאיזה מייל נשלח הקישור?') || '';
    FB.signInWithEmailLink(FB.auth, mail.trim().toLowerCase(), url).then(function () {
      history.replaceState(null, '', location.pathname);
    }).catch(function () { renderLogin('הקישור לא תקף או שפג תוקפו. שלחו קישור חדש.'); });
  }
  FB.getRedirectResult(FB.auth).catch(function () {});
  var booted = null;
  FB.onAuthStateChanged(FB.auth, function (user) {
    if (user) { if (booted === user.uid) return; booted = user.uid; boot(user); }
    else { booted = null; stopListen_(); renderLogin(); }
  });
}
</script>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.3.1/firebase-app.js';
import { getAuth, onAuthStateChanged, signOut, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult,
  sendSignInLinkToEmail, isSignInWithEmailLink, signInWithEmailLink, setPersistence, browserLocalPersistence } from 'https://www.gstatic.com/firebasejs/11.3.1/firebase-auth.js';
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, doc, collection, query, where, orderBy, limit,
  onSnapshot, getDoc, getDocs, writeBatch, serverTimestamp, runTransaction } from 'https://www.gstatic.com/firebasejs/11.3.1/firebase-firestore.js';
const app = initializeApp(window.FIREBASE_CONFIG);
const auth = getAuth(app);
auth.languageCode = 'he';
let db;
try { db = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) }); }
catch (e) { db = initializeFirestore(app, {}); }
window.FB = { app, auth, db, onAuthStateChanged, signOut, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult,
  sendSignInLinkToEmail, isSignInWithEmailLink, signInWithEmailLink, doc, collection, query, where, orderBy, limit,
  onSnapshot, getDoc, getDocs, writeBatch, serverTimestamp, runTransaction };
setPersistence(auth, browserLocalPersistence).catch(() => {}).finally(() => start());
</script>
</body>
